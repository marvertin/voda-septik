services:
  mqtt:
    image: eclipse-mosquitto:2.1.2
    container_name: mqtt
    restart: unless-stopped
    networks: [veve]
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

networks:
  veve:
    external: true
